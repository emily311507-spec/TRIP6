<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅行規劃</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
:root{--paper:#FFFCF6;--ink:#3E3A39;--spot:#F6D27A;--food:#F2A497;--stay:#A8D3E6;--trans:#B9DAA5;--gold:#8C5D00;--red:#A33C32;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Huninn,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
input,select,textarea,button{font:inherit;color:var(--ink)}
button{cursor:pointer}
a{color:var(--ink)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:1100px;margin:0 auto;padding:16px 14px 40px}
.box{background:#fff;border:3px solid var(--ink);border-radius:20px}
header{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px 16px;margin-bottom:14px;position:relative;overflow:hidden}
header>*{position:relative;z-index:1}
header>.hbg{position:absolute;z-index:0;right:0;bottom:0;width:100%;height:100%;pointer-events:none}
.t1{width:100%;border:0;background:transparent;font-size:clamp(24px,5vw,34px);font-weight:700;padding:2px 0}
.t2{width:100%;border:0;background:transparent;padding:2px 0;color:#6b6462}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-top:8px}
.eye{border:3px solid var(--ink);background:#fff;border-radius:12px;padding:2px 10px}
.train{display:inline-block;animation:chug 4s ease-in-out infinite}
@keyframes chug{50%{transform:translateX(3px)}}
nav{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
nav button,.btn{border:3px solid var(--ink);background:#fff;border-radius:14px;padding:6px 16px}
nav button[aria-selected="true"]{background:var(--trans);font-weight:700}
.btn.main{background:var(--trans)}
.btn.sm{padding:2px 10px;border-width:2px;border-radius:10px;font-size:14px}
.btn.dng{background:var(--food)}
details.set{margin-bottom:14px}
details.set summary{padding:8px 16px;cursor:pointer;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:0 16px 14px}
label.f{display:flex;flex-direction:column;font-size:14px;gap:2px}
.in{border:2px solid var(--ink);border-radius:10px;padding:5px 9px;background:#fff;width:100%}
.strip{overflow-x:auto;margin-bottom:12px}
#inner{position:relative;display:flex;gap:8px;padding-top:38px;min-width:max-content}
#illus{position:absolute;top:0;left:0;width:40px;height:30px;transition:left .55s cubic-bezier(.3,.1,.25,1)}
#illus svg{width:40px;height:30px;display:block}
.day{border:3px solid var(--ink);background:var(--paper);border-radius:14px;padding:4px 14px;text-align:center;line-height:1.3}
.day small{display:block;color:#6b6462}
.day[aria-selected="true"]{background:var(--trans);font-weight:700}
.day.pop b{display:inline-block;animation:pop .32s ease-out}
@keyframes pop{45%{transform:translateY(-3px) scale(1.12)}}
.panel{overflow:hidden}
.ph{background:var(--spot);border-bottom:3px solid var(--ink);padding:8px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
.pb{padding:14px}
.tl{display:flex;gap:12px}
.scale{position:relative;width:44px;flex:none;border-left:3px solid var(--ink);margin-left:8px}
.scale i{position:absolute;left:-9px;width:15px;height:15px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.cards{flex:1;min-width:0}
.card{border:3px solid var(--ink);border-left-width:12px;border-radius:16px;padding:10px 12px;margin-bottom:12px;background:#fff}
.card .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .tm{font-weight:700}
.tag{border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:13px}
.card h3{margin:2px 0;font-size:18px}
.mut{color:#6b6462;font-size:14px}
.warn{color:var(--red);font-size:14px}
.now{position:absolute;left:-3px;right:-36px;border-top:2px solid var(--red);pointer-events:none}
.now span{position:absolute;right:0;top:-11px;background:var(--red);color:#fff;font-size:12px;border-radius:8px;padding:0 6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.cols{grid-template-columns:1fr}}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:2px dotted var(--ink)}
.big{font-size:26px;font-weight:700}
.sw{display:inline-block;width:14px;height:14px;border:2px solid var(--ink);border-radius:4px;margin-right:6px;vertical-align:-2px}
.bar{height:14px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:#fff}
.bar i{display:block;height:100%;background:var(--trans)}
.pk{margin-bottom:14px}
.pk .ph{font-weight:700}
.item{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:2px dotted var(--ink)}
.item input[type=text]{flex:1;min-width:0;border:0;background:transparent;padding:2px 0}
.item.d .nm{text-decoration:line-through;opacity:.55}
.item input[type=checkbox]{width:26px;height:26px;flex:none;accent-color:#3E3A39;cursor:pointer}
#fab{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;flex-direction:column-reverse;align-items:center;gap:8px}
#fab>button.hb{background:var(--trans);border:3px solid var(--ink);border-radius:999px;width:56px;height:56px;font-size:24px;box-shadow:0 3px 0 var(--ink)}
#fab .hb span{display:inline-block;transition:transform .16s}
#fab.open .hb span{transform:rotate(180deg)}
#menu{display:none;flex-direction:column;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px}
#fab.open #menu{display:flex}
#menu button{border:2px solid var(--ink);background:var(--paper);border-radius:10px;padding:6px 18px;text-align:left}
dialog{border:3px solid var(--ink);border-radius:20px;background:var(--paper);max-width:520px;width:calc(100% - 28px);padding:0}
dialog::backdrop{background:rgba(62,58,57,.45)}
.dlg{padding:16px;display:grid;gap:10px}
.dlg h2{margin:0;font-size:20px}
.dlg textarea{min-height:140px}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:6px 16px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
#toast.on{opacity:1}
.empty{color:#6b6462;padding:10px 0}
.ci{display:inline-block;width:30px;height:22px;vertical-align:-5px;margin-right:6px}
.ci svg{width:30px;height:22px;display:block}
h3 .ci{margin-right:8px}
.fl{display:flex;align-items:center;gap:8px;margin:6px 0;background:var(--paper);border:2px dashed var(--ink);border-radius:12px;padding:8px 10px}
.fc{display:flex;flex-direction:column;line-height:1.25;min-width:0;max-width:34%}
.fc b{font-size:20px}
.fc small{font-size:12px;color:#6b6462}
.fc span{font-weight:700}
.fm{position:relative;flex:1;text-align:center;min-width:60px}
.fm::before{content:"";position:absolute;left:0;right:0;top:12px;border-top:2px dashed var(--ink)}
.fm .pi{position:relative;display:inline-block;width:36px;height:26px;background:var(--paper)}
.fm .pi svg{width:36px;height:26px;display:block}
.fm small{display:block;font-size:12px}
.chip{display:inline-flex;align-items:center;border:2px solid var(--ink);border-radius:999px;padding:0 10px 0 4px;font-size:13px;background:var(--paper);margin:2px 6px 2px 0}
.chip .ci{margin-right:4px}
.chip.warn{background:#F2A497;padding-left:10px}
.remind{display:block;width:100%;text-align:left;background:var(--spot);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;margin-bottom:12px;font-weight:700}
.bx{flex:1;min-width:0;display:flex;flex-direction:column}
.bx input{width:100%}
.bx .bt{color:#6b6462;font-size:14px}
@media (prefers-reduced-motion:reduce){.train,.day.pop b{animation:none}#illus{transition:none}}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.fchips button{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:0 12px;font-size:14px}
.fchips button[aria-pressed="true"]{background:var(--trans);font-weight:700}
.pill{flex:none;border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:13px;white-space:nowrap}
.r1{display:flex;align-items:center;gap:6px}
.r2{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.r2 select{border:2px solid var(--ink);border-radius:8px;padding:1px 6px;background:#fff;font-size:13px}
.trash{flex:none;border:0;background:transparent;color:#9a928f;width:22px;height:22px;padding:0;border-radius:6px}
.trash svg{width:16px;height:16px;display:block;margin:auto}
.trash:hover{color:var(--red)}
.item>.bx+.trash{align-self:flex-start;margin-top:2px}
.item input[type=checkbox]{margin-left:10px}
.trow{position:relative;padding-left:28px;padding-bottom:12px}
.trow .card{margin-bottom:0}
.trow::before{content:"";position:absolute;left:6px;top:22px;bottom:-22px;border-left:3px solid var(--ink)}
.trow:last-child::before{display:none}
.trow .dot{position:absolute;left:0;top:14px;width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);z-index:1}
.nowtag{background:var(--red);color:#fff;border-radius:8px;padding:0 8px;font-size:12px}
@media (max-width:600px){
body{font-size:14px;line-height:1.5}
#app{padding:10px 8px 30px}
header{padding:10px 12px;border-width:2px;border-radius:16px;margin-bottom:10px}
.t1{font-size:21px}
.t2{font-size:13px}
.stats{gap:4px 12px;font-size:13px;margin-top:4px}
nav{gap:6px;margin-bottom:10px}
nav button{padding:4px 12px;font-size:13px;border-width:2px;border-radius:12px}
.box,.card,.day{border-width:2px}
.day{padding:2px 10px;font-size:13px}
.day small{font-size:11px}
.ph{padding:6px 10px;font-size:14px}
.pb{padding:10px}
.card{padding:8px 10px;border-left-width:8px;border-radius:12px}
.card h3{font-size:15px}
.tag{font-size:11px;padding:0 8px}
.mut,.warn{font-size:12px}
.btn.sm{font-size:12px;padding:1px 8px}
.fc b{font-size:16px}
.fc small{font-size:10px}
.fl{padding:6px 8px;gap:6px}
.trow{padding-left:22px;padding-bottom:10px}
.trow .dot{width:14px;height:14px;top:12px}
.trow::before{left:5px;top:19px;bottom:-19px}
.remind{font-size:13px;padding:6px 10px}
.ci{width:24px;height:18px}
.ci svg{width:24px;height:18px}
}
.eye.tl{padding:0 8px;font-size:12px;border-width:2px;border-radius:10px;line-height:1.5}
</style>
</head>

 h+='<div class="row"><span>'+esc(T.settle)+' 合計（匯率 '+esc(T.rate)+'）</span><b>'+esc(money(Math.round(tot*T.rate),T.settle))+'</b></div>';
 h+='<div class="big" style="margin:10px 0">'+esc(money(Math.round(tot*T.rate),T.settle))+'</div>';
 if(est)h+='<p class="warn">其中 '+est+' 項金額待確認，總額只是估算。</p>';
 keys.forEach(function(k){h+='<div class="row"><span><i class="sw" style="background:'+CATS[k].c+'"></i>'+CATS[k].n+'</span><span>'+esc(money(sum[k]||0,T.cur))+'（'+esc(money(Math.round((sum[k]||0)*T.rate),T.settle))+'）</span></div>'});
 h+='<p class="mut">每人費用已乘以 '+esc(T.pax)+' 位旅客。先換算幣別再合計取整。</p></div></section>';
 h+='<section class="box panel"><div class="ph" style="background:var(--food)">支出組成</div><div class="pb">';
 if(!tot)h+='<p class="empty">還沒有任何費用。在行程中填入金額後，這裡會顯示圓餅圖。</p>';
 else{
  var a=-Math.PI/2,sv='<svg viewBox="-60 -60 120 120" style="width:100%;max-width:260px;display:block;margin:0 auto" role="img" aria-label="支出組成圓餅圖" stroke="'+INK+'" stroke-width="2.5" stroke-linejoin="round">';
  var act=keys.filter(function(k){return sum[k]>0});
  if(act.length===1)sv+='<circle r="50" fill="'+CATS[act[0]].c+'"/>';
  else act.forEach(function(k){var f=sum[k]/tot*Math.PI*2,x1=50*Math.cos(a),y1=50*Math.sin(a),x2=50*Math.cos(a+f),y2=50*Math.sin(a+f);sv+='<path d="M0 0L'+x1.toFixed(2)+' '+y1.toFixed(2)+'A50 50 0 '+(f>Math.PI?1:0)+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+'Z" fill="'+CATS[k].c+'"/>';a+=f});
  h+=sv+'</svg>';
  act.forEach(function(k){h+='<div class="row"><span><i class="sw" style="background:'+CATS[k].c+'"></i>'+CATS[k].n+'</span><b>'+Math.round(sum[k]/tot*100)+'%</b></div>'});
 }
 return h+'</div></section></div>';
}
function groups(){var g=[];T.pack.forEach(function(p){if(g.indexOf(p.g)<0)g.push(p.g)});return g}
function pack(){
 var done=T.pack.filter(function(p){return p.done}).length,all=T.pack.length;
 var h='<section class="box panel pk"><div class="pb"><div class="row" style="border:0"><b>準備進度 '+done+' / '+all+'</b><span class="mut">'+(all?Math.round(done/all*100):0)+'%</span></div><div class="bar"><i style="width:'+(all?done/all*100:0)+'%"></i></div>'
 +'<div class="acts" style="justify-content:flex-start;margin-top:10px"><input id="psearch" class="in" style="max-width:220px" placeholder="搜尋用品" aria-label="搜尋用品" value="'+esc(q)+'"><select id="pfilt" class="in" style="max-width:140px" aria-label="篩選"><option value="all"'+(filt==="all"?" selected":"")+'>全部</option><option value="todo"'+(filt==="todo"?" selected":"")+'>未完成</option><option value="done"'+(filt==="done"?" selected":"")+'>已完成</option></select><button class="btn sm main" data-act="addgroup">＋ 新增分類</button></div></div></section>';
 groups().forEach(function(g,gi){
  var items=T.pack.filter(function(p){return p.g===g&&(!q||p.n.indexOf(q)>=0)&&(filt==="all"||(filt==="done")===p.done)});
  h+='<section class="box panel pk"><div class="ph" style="background:'+GC[gi%GC.length]+'"><span>'+esc(g)+'</span><button class="btn sm" data-act="additem" data-g="'+esc(g)+'">＋ 新增</button></div><div class="pb">';
  if(!items.length)h+='<p class="empty">沒有符合的項目。</p>';
  items.forEach(function(p){h+='<div class="item'+(p.done?" d":"")+'"><button class="trash" data-act="delitem" data-id="'+p.id+'" aria-label="刪除 '+esc(p.n)+'" title="刪除"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h12M8 6V4h4v2M6 6l1 10h6l1-10"/></svg></button><input type="text" class="nm" data-pn="'+p.id+'" value="'+esc(p.n)+'" aria-label="品名"><input type="checkbox" data-chk="'+p.id+'" aria-label="完成"'+(p.done?" checked":"")+'></div>'});
  h+='</div></section>';
 });
 return h;
}
function render(){
 if(day>=T.nd)day=T.nd-1;if(day<0)day=0;
 settings();head();nav();
 $("main").innerHTML=view==="plan"?plan():view==="buy"?buy():pack();
 if(view==="plan")strip(false);
}
function openDlg(h){$("dlg").innerHTML='<div class="dlg">'+h+'</div>';if(!$("dlg").open)$("dlg").showModal()}
function closeDlg(){$("dlg").close()}
function editDlg(id){
 var s=id?T.stops.filter(function(x){return x.id===id})[0]:{id:"",day:day,time:"09:00",dur:60,cat:"spot",name:"",addr:"",cost:0,per:"p",est:false,note:"",lock:false};
 var f=function(l,k,t,ex){return '<label class="f">'+l+'<input class="in" id="e_'+k+'" type="'+t+'" value="'+esc(s[k])+'" '+(ex||"")+'></label>'};
 var opt=function(o,v){return Object.keys(o).map(function(k){return '<option value="'+k+'"'+(k===v?" selected":"")+'>'+o[k]+'</option>'}).join("")};
 openDlg('<h2>'+(id?"編輯行程":"新增行程")+'</h2>'+f("名稱","name","text")+'<div class="grid" style="padding:0">'+f("開始時間","time","time")+f("時長（分鐘）","dur","number",'min="0"')+'<label class="f">類別<select class="in" id="e_cat">'+opt({spot:"景點",food:"餐飲",stay:"住宿",trans:"交通"},s.cat)+'</select></label>'+'</div>'+f("地址","addr","text")+'<label class="f">地圖程式<select class="in" id="e_mp">'+opt({amap:"高德地圖",google:"Google 地圖"},s.mp||((s.kind==="flight"||s.kind==="layover")?"google":"amap"))+'</select></label>'+f("地圖搜尋關鍵字（選填，留空就用名稱＋地址）","mq","text")+f("自訂地圖連結（選填，貼上分享連結會優先使用）","mu","text")+f("備註","note","text")
 +''
 +'<div class="acts"><button class="btn" data-act="close">取消</button><button class="btn main" data-act="saveedit" data-id="'+esc(id||"")+'" data-day="'+s.day+'">儲存</button></div>');
}
function saveEdit(id,dy){
 var g=function(k){return $("e_"+k)};
 var o={name:g("name").value.trim()||"未命名",time:g("time").value||"09:00",dur:+g("dur").value||0,cat:g("cat").value,addr:g("addr").value,note:g("note").value,mp:g("mp").value,mq:g("mq").value.trim(),mu:g("mu").value.trim()};
 mutate(function(){if(id){T.stops.forEach(function(s){if(s.id===id)for(var k in o)s[k]=o[k]})}else{o.id=uid();o.day=+dy;T.stops.push(o)}});closeDlg();
}
function icsText(){
 var pad=function(n){return String(n).padStart(2,"0")},ft=function(di,m){var d=new Date(base()+di*864e5+m*6e4);return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+"T"+pad(d.getUTCHours())+pad(d.getUTCMinutes())+"00"};
 var e=function(v){return String(v||"").replace(/[\\;,]/g,"\\$&").replace(/\n/g,"\\n")};
 var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//travel-planner//ZH-TW//"];
 T.stops.forEach(function(s){var st=mins(s.time);L.push("BEGIN:VEVENT","UID:"+s.id+"@travel-planner","DTSTAMP:"+ft(0,0).slice(0,8)+"T000000Z","DTSTART;TZID="+T.tz+":"+ft(s.day,st),"DTEND;TZID="+T.tz+":"+ft(s.day,st+(+s.dur||0)),"SUMMARY:"+e("["+CATS[s.cat].n+"] "+s.name),"LOCATION:"+e(s.addr),"DESCRIPTION:"+e(s.note),"END:VEVENT")});
 L.push("END:VCALENDAR");return L.join("\r\n");
}
function textDlg(title,text,ro,fname,mime){
 openDlg('<h2>'+title+'</h2><textarea id="tx" class="in"'+(ro?" readonly":"")+'>'+esc(text)+'</textarea><div class="acts"><button class="btn" data-act="close">關閉</button>'+(ro?'<button class="btn" data-act="copy">複製</button><button class="btn main" data-act="dl" data-f="'+fname+'" data-m="'+mime+'">下載檔案</button>':'<button class="btn main" data-act="doimport">匯入</button>')+'</div>');
 if(ro)$("tx").select();
}
document.addEventListener("click",function(e){
 var b=e.target.closest("button");
  if(!b)return;
 var a=b.dataset.act;
 if(b.dataset.view){view=b.dataset.view;render();return}
 if(b.dataset.bf){bf=b.dataset.bf;render();return}
 if(b.dataset.day!==undefined&&!a){day=+b.dataset.day;render();strip(true);return}
 if(!a)return;
 if(a==="eye"){hide=!hide;head()}
 else if(a==="add")editDlg("");
 else if(a==="edit")editDlg(b.dataset.id);
 else if(a==="saveedit")saveEdit(b.dataset.id,b.dataset.day);
 else if(a==="close")closeDlg();
 else if(a==="lock")mutate(function(){T.stops.forEach(function(s){if(s.id===b.dataset.id)s.lock=!s.lock})});
 else if(a==="del"){var s=T.stops.filter(function(x){return x.id===b.dataset.id})[0];var go=function(){mutate(function(){T.stops=T.stops.filter(function(x){return x.id!==s.id})});toast("已刪除，可用工具選單復原")};go()}
 else if(a==="tools")openDlg('<h2>工具</h2><div style="display:grid;gap:8px"><a class="btn" href="https://mobile.amap.com/cn/" target="_blank" rel="noopener" style="text-decoration:none;text-align:center">🗺️ 開啟高德地圖</a><button class="btn" data-act="undo">↶ 復原上一步</button></div><div class="acts"><button class="btn" data-act="close">關閉</button></div>')
 else if(a==="undo"){if(!undo.length){toast("沒有可復原的動作");return}T=JSON.parse(undo.pop());save();render();closeDlg();toast("已復原")}
 else if(a==="exportjson")textDlg("匯出 JSON（可複製保存）",JSON.stringify(T,null,1),true,"trip.json","application/json");
 else if(a==="exportics")textDlg("匯出 ICS（時間以 "+esc(T.tz)+" 當地時間計算）",icsText(),true,"trip.ics","text/calendar");
 else if(a==="importjson")textDlg("匯入 JSON（貼上先前匯出的內容）","",false);
 else if(a==="doimport"){try{var o=JSON.parse($("tx").value);if(!o||!Array.isArray(o.stops)||!o.nd)throw 0;mutate(function(){T=o;if(!T.pack)T.pack=[];if(!T.buy)T.buy=[]});closeDlg();toast("已匯入")}catch(x){toast("格式不正確，請貼上完整的匯出內容")}}
 else if(a==="copy"){try{$("tx").select();document.execCommand("copy");toast("已複製")}catch(x){toast("請手動選取後複製")}}
 else if(a==="dl"){try{var u=URL.createObjectURL(new Blob([$("tx").value],{type:b.dataset.m})),l=document.createElement("a");l.href=u;l.download=b.dataset.f;document.body.appendChild(l);l.click();l.remove();toast("若沒有下載，請改用「複製」")}catch(x){toast("請改用「複製」")}}
 else if(a==="reset")askOk("要用示範旅程取代目前的內容嗎？（之後仍可復原）",function(){mutate(function(){T=sample()})})
 else if(a==="ok"){var f=okFn;okFn=null;closeDlg();if(f)f()}
 else if(a==="addbuy"){var nm=$("bn").value.trim();if(!nm){toast("請先輸入項目名稱");return}var nt=$("bt").value.trim(),ty=$("bty_new").value,dv=$("bd_new").value;mutate(function(){T.buy=T.buy||[];T.buy.push({id:uid(),n:nm,note:nt,t:ty,d:dv===""?null:+dv,done:false})});if($("bn"))$("bn").focus()}
 else if(a==="delbuy"){mutate(function(){T.buy=(T.buy||[]).filter(function(x){return x.id!==b.dataset.id})});toast("已刪除，可用工具選單復原")}
 else if(a==="additem")packDlg(b.dataset.g)
 else if(a==="addgroup")packDlg("")
 else if(a==="savepack"){var gg=b.dataset.g||($("pk_g")?$("pk_g").value.trim():""),nn=$("pk_n").value.trim();if(!gg||!nn){toast("請填寫分類名稱和用品名稱");return}mutate(function(){T.pack.push({id:uid(),g:gg,n:nn,done:false})});closeDlg()}
 else if(a==="delitem"){mutate(function(){T.pack=T.pack.filter(function(p){return p.id!==b.dataset.id})});toast("已刪除，可用工具選單復原")}
});
document.addEventListener("input",function(e){
 var el=e.target;
 if(el.id==="name"){T.name=el.value;document.title=el.value||"旅行規劃";save()}
 else if(el.id==="dest"){T.dest=el.value;save()}
 else if(el.id==="psearch"){q=el.value;var pos=el.selectionStart;render();var n=$("psearch");n.focus();n.setSelectionRange(pos,pos)}
 else if(el.dataset.bn){(T.buy||[]).forEach(function(p){if(p.id===el.dataset.bn)p.n=el.value});save()}
 else if(el.dataset.bt){(T.buy||[]).forEach(function(p){if(p.id===el.dataset.bt)p.note=el.value});save()}
 else if(el.dataset.pn){T.pack.forEach(function(p){if(p.id===el.dataset.pn)p.n=el.value});save()}
 else if(el.dataset.pq){T.pack.forEach(function(p){if(p.id===el.dataset.pq)p.q=+el.value||1});save()}
});
document.addEventListener("change",function(e){
 var el=e.target;
 if(el.dataset.bty){(T.buy||[]).forEach(function(p){if(p.id===el.dataset.bty)p.t=el.value});save();render()}
 else if(el.dataset.bd!==undefined){(T.buy||[]).forEach(function(p){if(p.id===el.dataset.bd)p.d=el.value===""?null:+el.value});save();render()}
 else if(el.dataset.bchk){(T.buy||[]).forEach(function(p){if(p.id===el.dataset.bchk)p.done=el.checked});save();render()}
 else if(el.id==="pfilt"){filt=el.value;render()}
 else if(el.dataset.chk){T.pack.forEach(function(p){if(p.id===el.dataset.chk)p.done=el.checked});save();render()}
 else if(el.dataset.set){var k=el.dataset.set,v=el.value;if(["nd","pax","rate"].indexOf(k)>=0)v=+v||(k==="rate"?0:1);if(k==="nd")v=Math.min(30,Math.max(1,Math.round(v)));mutate(function(){T[k]=v})}
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&(e.target.id==="bn"||e.target.id==="bt")){e.preventDefault();var ab=document.querySelector('[data-act="addbuy"]');if(ab)ab.click()}});
window.addEventListener("resize",function(){if(view==="plan")strip(false)});
setInterval(function(){if(view==="plan")render()},15000);
document.title=T.name||"旅行規劃";
settings();render();
</script>
</body>
</html>
